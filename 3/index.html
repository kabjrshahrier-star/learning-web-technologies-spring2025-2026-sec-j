<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assessment Task</title>

  <style>
    .page { display: none; }
    .page.active { display: block; }
    .error { color: red; }
  </style>
</head>
<body>



<div id="page1" class="page active">
  <h3>1. Name</h3>
  <form id="form1">
    <input type="text" id="nameInput">
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg1" class="error"></p>
  </form>
</div>


<div id="page2" class="page">
  <h3>2. Email</h3>
  <form id="form2">
    <input type="text" id="emailInput" placeholder="sample@example.com">
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg2" class="error"></p>
  </form>
</div>


<div id="page3" class="page">
  <h3>3. Gender</h3>
  <form id="form3">
    <label><input type="radio" name="gender" value="Male"> Male</label>
    <label><input type="radio" name="gender" value="Female"> Female</label>
    <label><input type="radio" name="gender" value="Other"> Other</label>
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg3" class="error"></p>
  </form>
</div>


<div id="page4" class="page">
  <h3>4. Date of Birth</h3>
  <form id="form4">
    <input type="text" id="dd" placeholder="dd" size="2"> /
    <input type="text" id="mm" placeholder="mm" size="2"> /
    <input type="text" id="yyyy" placeholder="yyyy" size="4">
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg4" class="error"></p>
  </form>
</div>


<div id="page5" class="page">
  <h3>5. Degree</h3>
  <form id="form5">
    <label><input type="checkbox" name="degree" value="SSC"> SSC</label>
    <label><input type="checkbox" name="degree" value="HSC"> HSC</label>
    <label><input type="checkbox" name="degree" value="BSc"> BSc</label>
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg5" class="error"></p>
  </form>
</div>


<div id="page6" class="page">
  <h3>6. Blood Group</h3>
  <form id="form6">
    <select id="blood">
      <option value="">Select</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
    </select>
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg6" class="error"></p>
  </form>
</div>


<div id="page7" class="page">
  <h3>7. Profile Picture</h3>
  <form id="form7">
    User Id: <input type="text" id="userId">
    <br><br>
    Picture: <input type="file" id="pic" accept="image/*">
    <br><br>
    <button type="submit">Submit</button>
    <p id="msg7" class="error"></p>
  </form>
</div>


<div id="page8" class="page">
  <h3>8. Completed </h3>
  <p>All pages completed successfully.</p>
</div>


<script src="script.js"></script>
</body>
</html>
