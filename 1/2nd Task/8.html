<!DOCTYPE html>
<html>
<head>
    <title>Person Profile</title>
    <style>
        table {
            width: 450px;
            border-collapse: collapse;
            margin: 20px;
        }
        td {
            border: 1px solid #000;
            padding: 8px;
        }
        h2 {
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .center {
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td colspan="3"><h2>PERSON PROFILE</h2></td>
    </tr>

    <tr>
        <td>Name</td>
        <td><input type="text"></td>
        <td></td>
    </tr>

    <tr>
        <td>Email</td>
        <td><input type="email"></td>
        <td></td>
    </tr>

    <tr>
        <td>Gender</td>
        <td colspan="2">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </td>
    </tr>

    <tr>
        <td>Date of Birth</td>
        <td>
            <input type="text" size="2"> /
            <input type="text" size="2"> /
            <input type="text" size="4">
        </td>
        <td>(dd/mm/yyyy)</td>
    </tr>

    <tr>
        <td>Blood Group</td>
        <td>
            <select>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>
        </td>
        <td></td>
    </tr>

    <tr>
        <td>Degree</td>
        <td colspan="2">
            <input type="checkbox"> SSC
            <input type="checkbox"> HSC
            <input type="checkbox"> BSc.
            <input type="checkbox"> MSc.
        </td>
    </tr>

    <tr>
        <td>Photo</td>
        <td colspan="2">
            <input type="file">
        </td>
    </tr>

    <tr>
        <td colspan="3" class="center">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </td>
    </tr>
</table>

</body>
</html>
